<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل Bex Ball | MTG Store</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/106ba5d17b.js" crossorigin="anonymous"></script>
</head>
<body class="dark-theme">
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Marwan<span>Store</span></a>
            <a href="index.html" class="btn-link" style="margin:0; padding: 8px 20px;">العودة للمتجر</a>
        </div>
    </header>

    <main class="container" style="padding-top: 150px; min-height: 100vh;">
        <div class="app-card fade-in-up" style="max-width: 600px; margin: 0 auto; text-align: center;">
            <div class="app-img">
                <img src="picture/Bex ball.jpg" alt="Bex Ball" style="width: 150px; height: 150px; border-radius: 30px;">
            </div>
            <h1 style="color: var(--text-head); margin: 20px 0;">تحميل لعبة Bex Ball</h1>
            <p style="margin-bottom: 30px;">استعد لتجربة فريدة من نوعها على هاتفك الأندرويد. اللعبة آمنة تماماً ومحدثة لآخر إصدار.</p>
            
            <div class="download-info" style="background: var(--bg-main); padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-around;">
                    <span><i class="fas fa-file-archive"></i> APK</span>
                    <span><i class="fas fa-robot"></i> Android</span>
                    <span><i class="fas fa-check-circle"></i> V1.0</span>
                </div>
            </div>

            <a href="apps/clicker.apk" class="btn-primary" style="display: block; width: 100%; font-size: 1.2rem;" download>
                تحميل الآن مجاناً <i class="fas fa-download"></i>
            </a>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
