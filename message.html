<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي | MTG Store</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/106ba5d17b.js" crossorigin="anonymous"></script>
</head>
<body class="dark-theme">
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Marwan<span>Store</span></a>
        </div>
    </header>

    <main class="container" style="padding-top: 150px; min-height: 100vh;">
        <div class="app-card fade-in-up" style="max-width: 500px; margin: 0 auto;">
            <h2 style="color: var(--text-head); margin-bottom: 30px; text-align: center;">أرسل رسالة مباشرة</h2>
            
            <form action="https://formsubmit.co/marwan.tarek.abosalem@gmail.com" method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">الاسم</label>
                    <input type="text" name="name" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: white;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">البريد الإلكتروني</label>
                    <input type="email" name="email" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: white;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">رسالتك</label>
                    <textarea name="message" rows="5" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: white;"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">إرسال الرسالة</button>
            </form>
            
            <a href="index.html" style="display: block; text-align: center; margin-top: 20px; color: var(--text-body); text-decoration: none;">إلغاء والعودة</a>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
